name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  unit:
    name: Unit & integration tests
    runs-on: ubuntu-24.04
    # The shared store (classes and settings across instances) is tested against a real Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  # The Playwright web server builds the client and serves it with fixture grounding (tests/e2e/server.ts).
  e2e-desktop:
    name: End-to-end (desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-desktop
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Chromium on a real Android device: redroid (Android 12 in Docker) over ADB, phone and tablet sizes.
  e2e-mobile:
    name: End-to-end (mobile, Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The device reaches the test server through the Docker bridge, not loopback.
      E2E_HOST: 0.0.0.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Start Android (redroid)
        run: ./scripts/start-redroid.sh
      - run: npm ci
      - run: npm run test:e2e:mobile
      - name: Android logs
        if: failure()
        env:
          # adb also lists the device under a second name; pick redroid's.
          ANDROID_SERIAL: 127.0.0.1:5555
        run: |
          adb devices -l || true
          adb shell wm size || true
          adb logcat -d -t 400 > "$RUNNER_TEMP/logcat.txt" 2>&1 || true
          tail -n 120 "$RUNNER_TEMP/logcat.txt" || true
          docker logs --tail 100 life-redroid || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-mobile
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/logcat.txt
          retention-days: 7

  # The real-services suite: Google Maps in the browser, the omni model (text and voice) and
  # postcard images through mm-gateway, so real costs. Pushes to main and manual runs only;
  # pull requests never get it (and forks get no secrets).
  real-check:
    name: Real services configured?
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      images: ${{ steps.check.outputs.images }}
      claude: ${{ steps.check.outputs.claude }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY || secrets.GOOGLE_MAPS_API_KEY }}
          VOICE_TTS_MODEL: ${{ vars.VOICE_TTS_MODEL }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
          OMNI_API_FORMAT: ${{ vars.OMNI_API_FORMAT }}
          OMNI_BASE_URL: ${{ vars.OMNI_BASE_URL }}
          OMNI_MODEL: ${{ vars.OMNI_MODEL }}
          OMNI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          IMAGE_MODEL_TYPE: ${{ vars.IMAGE_MODEL_TYPE }}
          IMAGE_MODEL_BASE_URL: ${{ vars.IMAGE_MODEL_BASE_URL }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          IMAGE_MODEL_API_KEY: ${{ secrets.IMAGE_MODEL_API_KEY }}
        run: |
          missing=()
          for v in GOOGLE_MAPS_API_KEY GOOGLE_MAPS_MAP_ID OMNI_API_FORMAT OMNI_BASE_URL OMNI_MODEL OMNI_API_KEY; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice title=Real-services suite skipped::not set: ${missing[*]}"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
          # Postcard images are optional: without them the suite skips its postcard step.
          images=true
          for v in IMAGE_MODEL_TYPE IMAGE_MODEL_BASE_URL IMAGE_MODEL IMAGE_MODEL_API_KEY; do
            [ -n "${!v}" ] || images=false
          done
          echo "images=$images" >> "$GITHUB_OUTPUT"
          # Optional extras, each exercised live once it is set:
          #   GOOGLE_MAPS_SERVER_KEY (secret): Maps agent tools and walking routes in the real suite.
          #     Without it CI uses GOOGLE_MAPS_API_KEY, which works while that key has no referrer
          #     restriction (a production server should have a key of its own);
          #   VOICE_TTS_MODEL (variable): a speech model for the locals' voices;
          #   ANTHROPIC_API_KEY (secret): the evaluation pass with Claude.
          [ -n "$GOOGLE_MAPS_SERVER_KEY" ] || echo "::notice title=Maps agent tools not exercised::set the GOOGLE_MAPS_SERVER_KEY (or GOOGLE_MAPS_API_KEY) secret"
          [ -n "$VOICE_TTS_MODEL" ] || echo "::notice title=Speaking locals not exercised::set the VOICE_TTS_MODEL variable"
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "claude=true" >> "$GITHUB_OUTPUT"; else echo "claude=false" >> "$GITHUB_OUTPUT"; echo "::notice title=Claude evaluation skipped::set the ANTHROPIC_API_KEY secret"; fi

  e2e-real:
    name: End-to-end on real services
    runs-on: ubuntu-24.04
    needs: real-check
    if: needs.real-check.outputs.configured == 'true'
    timeout-minutes: 45
    env:
      # The org's omni model plays every agent and listens (its server rejects audio output, so
      # locals use the browser's voice). Its settings map onto the app's provider-neutral AI_*
      # variables, and VOICE_MODEL shares the AI_* endpoint and key.
      AI_PROVIDER: ${{ vars.OMNI_API_FORMAT }}
      AI_MODEL: ${{ vars.OMNI_MODEL }}
      AI_BASE_URL: ${{ vars.OMNI_BASE_URL }}
      VOICE_MODEL: ${{ vars.OMNI_MODEL }}
      # A speech model for the locals, when the organization has one (else the browser's voices).
      VOICE_TTS_MODEL: ${{ vars.VOICE_TTS_MODEL }}
      GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
      # Only used with a server key (GOOGLE_MAPS_SERVER_KEY, else GOOGLE_MAPS_API_KEY): walking times to each local.
      MAPS_WALKING_ROUTES: "true"
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
      APP_USER_AGENT: CommonGround-CI/0.2 (+https://github.com/${{ github.repository }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Real speech for voice mode: an English line for the microphone and a Spanish phrase to pronounce.
      - name: Make speech samples
        run: |
          sudo apt-get install -y --no-install-recommends espeak-ng > /dev/null
          # Outside test-results/real: Playwright empties its output folder when a run starts.
          mkdir -p test-results/speech
          espeak-ng -v en-us -s 145 -w test-results/speech/voice-input.wav "Hello! It's my first time here. What do you enjoy most about your work?"
          espeak-ng -v es -s 130 -w test-results/speech/pronounce-es.wav "Buenas noches"
      # mm-gateway holds the image provider's key; the app gets only the gateway's URL and a run key.
      - name: Start mm-gateway
        if: needs.real-check.outputs.images == 'true'
        env:
          IMAGE_MODEL_TYPE: ${{ vars.IMAGE_MODEL_TYPE }}
          IMAGE_MODEL_BASE_URL: ${{ vars.IMAGE_MODEL_BASE_URL }}
          IMAGE_MODEL_API_KEY: ${{ secrets.IMAGE_MODEL_API_KEY }}
        run: node scripts/mm-gateway.ts start
      # Fails fast, with each server's answer, if a model or the gateway is unreachable or misconfigured.
      - name: Probe the services
        timeout-minutes: 10
        env:
          AI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY || secrets.GOOGLE_MAPS_API_KEY }}
        run: node scripts/probe-ai.ts
      # The keys reach these steps only.
      - name: Real-services suite
        env:
          AI_API_KEY: ${{ secrets.OMNI_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY || secrets.GOOGLE_MAPS_API_KEY }}
        run: npm run test:e2e:real
      # The evaluation plan (docs/DESIGN.md §7.5) on the same model. Its report goes to the job
      # summary; model quality varies run to run, so a weak result is reported, not a failure.
      - name: Evaluation (omni model)
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        env:
          AI_API_KEY: ${{ secrets.OMNI_API_KEY }}
        run: node scripts/eval.ts --places 4 --judge --out test-results/eval
      - name: Stop mm-gateway
        if: always() && needs.real-check.outputs.images == 'true'
        env:
          IMAGE_MODEL_API_KEY: ${{ secrets.IMAGE_MODEL_API_KEY }}
        run: node scripts/mm-gateway.ts stop
      # Screenshots, the probe's samples, the gateway log (keys removed) and the HTML report.
      # No traces: they would record the browser Maps key.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-real
          path: |
            playwright-report-real/
            test-results/real/
            test-results/probe/
            test-results/eval/
          if-no-files-found: ignore
          retention-days: 7

  # The evaluation pass with Claude, once the repository has an ANTHROPIC_API_KEY secret.
  eval-claude:
    name: Evaluation with Claude
    runs-on: ubuntu-24.04
    needs: real-check
    if: needs.real-check.outputs.claude == 'true'
    timeout-minutes: 30
    env:
      AI_PROVIDER: anthropic
      APP_USER_AGENT: CommonGround-CI/0.3 (+https://github.com/${{ github.repository }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Evaluation (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/eval.ts --places 6 --judge --out test-results/eval-claude
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-claude
          path: test-results/eval-claude/
          if-no-files-found: ignore
          retention-days: 30

  docker:
    name: Docker image (amd64 + arm64)
    runs-on: ubuntu-24.04
    needs: [build, unit, e2e-desktop, e2e-mobile]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # arm64 is emulated on the amd64 runner; only the per-platform dependency and runtime stages run under QEMU.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Common Ground
          cache-from: type=gha
          cache-to: type=gha,mode=max
