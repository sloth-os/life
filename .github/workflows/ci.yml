name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  unit:
    name: Unit & integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  # The Playwright web server builds the client and serves it with fixture grounding (tests/e2e/server.ts).
  e2e-desktop:
    name: End-to-end (desktop)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-desktop
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Chromium on a real Android device: redroid (Android 12 in Docker) over ADB, phone and tablet sizes.
  e2e-mobile:
    name: End-to-end (mobile, Android)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The device reaches the test server through the Docker bridge, not loopback.
      E2E_HOST: 0.0.0.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Start Android (redroid)
        run: ./scripts/start-redroid.sh
      - run: npm ci
      - run: npm run test:e2e:mobile
      - name: Android logs
        if: failure()
        run: |
          adb devices -l || true
          adb shell wm size || true
          adb logcat -d -t 400 > "$RUNNER_TEMP/logcat.txt" 2>&1 || true
          tail -n 120 "$RUNNER_TEMP/logcat.txt" || true
          docker logs --tail 100 life-redroid || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-mobile
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/logcat.txt
          retention-days: 7

  # The real-services suite: Google Maps in the browser and a real model, so real costs.
  # Pushes to main and manual runs only; pull requests never get it (and forks get no secrets).
  real-check:
    name: Real services configured?
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
          VISION_MODEL_TYPE: ${{ vars.VISION_MODEL_TYPE }}
          VISION_MODEL_BASE_URL: ${{ vars.VISION_MODEL_BASE_URL }}
          VISION_MODEL: ${{ vars.VISION_MODEL }}
          VISION_MODEL_API_KEY: ${{ secrets.VISION_MODEL_API_KEY }}
        run: |
          missing=()
          for v in GOOGLE_MAPS_API_KEY GOOGLE_MAPS_MAP_ID VISION_MODEL_TYPE VISION_MODEL_BASE_URL VISION_MODEL VISION_MODEL_API_KEY; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice title=Real-services suite skipped::not set: ${missing[*]}"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  e2e-real:
    name: End-to-end on real services
    runs-on: ubuntu-24.04
    needs: real-check
    if: needs.real-check.outputs.configured == 'true'
    timeout-minutes: 45
    env:
      # The org's model settings map onto the app's provider-neutral AI_* variables.
      AI_PROVIDER: ${{ vars.VISION_MODEL_TYPE }}
      AI_MODEL: ${{ vars.VISION_MODEL }}
      AI_BASE_URL: ${{ vars.VISION_MODEL_BASE_URL }}
      GOOGLE_MAPS_MAP_ID: ${{ vars.GOOGLE_MAPS_MAP_ID }}
      APP_USER_AGENT: CommonGround-CI/0.1 (+https://github.com/${{ github.repository }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Fails fast, with the server's answer, if the model is unreachable or misconfigured.
      - name: Probe the model
        timeout-minutes: 8
        env:
          AI_API_KEY: ${{ secrets.VISION_MODEL_API_KEY }}
        run: node scripts/probe-ai.ts
      # The keys reach these steps only.
      - name: Real-services suite
        env:
          AI_API_KEY: ${{ secrets.VISION_MODEL_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: npm run test:e2e:real
      # Screenshots and the HTML report only: no traces, which would record the browser Maps key.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-real
          path: |
            playwright-report-real/
            test-results/real/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image (amd64 + arm64)
    runs-on: ubuntu-24.04
    needs: [build, unit, e2e-desktop, e2e-mobile]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # arm64 is emulated on the amd64 runner; only the per-platform dependency and runtime stages run under QEMU.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Common Ground
          cache-from: type=gha
          cache-to: type=gha,mode=max
