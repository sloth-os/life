<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Common Ground</title>
    <meta name="description" content="Explore the real world on a map, meet AI locals grounded in real places, and practise social skills with a mentor's feedback." />
    <meta name="theme-color" content="#e0663a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Chinese, for devices without a CJK font: Google serves it in slices, fetched only for characters on the page. -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Japanese draws many of the same characters differently, so it gets its own (also sliced). -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Fraunces shifts the macron of ā ē ī ō ū to the right; Literata draws just those letters. -->
    <link href="https://fonts.googleapis.com/css2?family=Literata:wght@500..700&text=%C4%80%C4%81%C4%92%C4%93%C4%AA%C4%AB%C5%8C%C5%8D%C5%AA%C5%AB%C7%95%C7%96%C8%B2%C8%B3&display=swap" rel="stylesheet" />
  </head>
